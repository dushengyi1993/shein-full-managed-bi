<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SHEIN 全托销量矩阵、日月趋势、店铺与商品排行、运营提醒的只读驾驶舱">
    <meta name="theme-color" content="#f7f7f3">
    <meta name="color-scheme" content="light">
    <title>SHEIN 全托运营驾驶舱</title>
    <link rel="icon" href="/favicon.svg?v=20260811.2" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=20260811.2">
    <link rel="stylesheet" href="/home-parity.css?v=20260811.2">
    <script src="/app.js?v=20260811.2" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到主要内容</a>

    <div class="app-shell">
      <aside class="sidebar" aria-label="全托运营工作台">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <img src="/favicon.svg?v=20260811.2" alt="">
          </div>
          <div>
            <h1>SHEIN BI</h1>
            <p>全托运营工作台</p>
          </div>
        </div>

        <nav class="nav primary-nav" aria-label="主导航">
          <a href="#home" data-route="home">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a8 8 0 1 1 16 0v5H4v-5Z"/><path d="m12 14 3-4M7 16h10"/></svg>
            <span>总控驾驶舱</span>
          </a>
          <a href="#products" data-route="products">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
            <span>商品经营</span>
          </a>
          <a href="#inventory" data-route="inventory">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 8 8-5 8 5v9l-8 4-8-4V8Z"/><path d="m4 8 8 4 8-4M12 12v9"/></svg>
            <span>库存与备货</span>
          </a>
          <a href="#procurement" data-route="procurement">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v10H3V6Zm11 4h4l3 3v3h-7v-6Z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <span>采购履约</span>
          </a>
          <a href="#returns" data-route="returns">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4Z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>退货与质量</span>
          </a>
          <a href="#finance" data-route="finance">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
            <span>财务与结算</span>
          </a>
          <a href="#marketing" data-route="marketing">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13V9h4l9-4v12l-9-4H4Z"/><path d="m8 13 1 6h3l-1-5M20 9v4"/></svg>
            <span>营销机会</span>
          </a>
          <a href="#ops" data-route="ops">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6V4Z"/><path d="m9 9 1 1 2-2M13 9h2M9 14l1 1 2-2M13 14h2"/></svg>
            <span>运营待办</span>
          </a>
          <a href="#system" data-route="system">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10H4Zm6 0V4h4v16h-4Zm6 0v-7h4v7h-4Z"/></svg>
            <span>数据与系统</span>
          </a>
        </nav>

        <div class="account-box sidebar-context sidebar-account" aria-live="polite">
          <div class="account-main">
            <div class="account-identity">
              <span class="account-label">登录账号</span>
              <strong id="sidebar-account-name" class="account-name">正在读取</strong>
            </div>
            <button id="logout-button" class="logout-button logout-btn" type="button">退出</button>
          </div>
          <p id="sidebar-permission">账号权限待确认</p>
        </div>

        <div id="sidebar-sample-note" class="sample-note" hidden>
          <strong>示例数据</strong>
          <span>当前数值仅用于界面与流程验证，不代表真实经营结果。</span>
        </div>
      </aside>

      <div class="workspace main">
        <header class="command command-bar" aria-label="全局销量筛选">
          <div class="mobile-title">
            <span>FULL-MANAGED OPERATIONS</span>
            <strong id="mobile-page-title">今日经营</strong>
          </div>

          <div class="bar home-filter-bar">
            <div class="field filter-field search-field">
              <label for="global-search">搜索</label>
              <input id="global-search" type="search" placeholder="店铺 / 单号 / 货号 / SKC / SKU / 商品名" autocomplete="off">
            </div>

            <div class="field filter-field scope-field">
              <label for="scope-filter">店铺</label>
              <select id="scope-filter" aria-label="店铺或负责人范围">
                <option value="ALL">全部店铺</option>
              </select>
            </div>

            <div class="range-dock" role="group" aria-label="销量时间口径">
              <div class="range-toolbar">
                <div class="range-toolbar-main">
                  <button type="button" class="range-button" id="range-toggle" aria-controls="range-popover" aria-expanded="false">
                    <span>时间筛选</span>
                    <div>
                      <strong id="range-summary">今日 · 当日累计</strong>
                      <small>影响指标、趋势、排行和明细</small>
                    </div>
                  </button>
                  <div class="range-preset-strip" role="group" aria-label="快捷日期范围">
                    <button type="button" data-home-range-preset="today" aria-pressed="true">今天</button>
                    <button type="button" data-home-range-preset="yesterday" aria-pressed="false">昨天</button>
                    <button type="button" data-home-range-preset="last3" aria-pressed="false">近3天</button>
                    <button type="button" data-home-range-preset="last7" aria-pressed="false">近7天</button>
                    <button type="button" data-home-range-preset="last15" aria-pressed="false">近15天</button>
                    <button type="button" data-home-range-preset="last30" aria-pressed="false">近30天</button>
                    <button type="button" data-home-range-preset="thisMonth" aria-pressed="false">本月</button>
                    <button type="button" data-home-range-preset="lastMonth" aria-pressed="false">上个月</button>
                    <button type="button" data-home-range-preset="last3Months" aria-pressed="false">近3个月</button>
                    <button type="button" data-home-range-preset="last6Months" aria-pressed="false">近6个月</button>
                    <button type="button" data-home-range-preset="lastYear" aria-pressed="false">近一年</button>
                  </div>
                </div>
                <div class="range-popover" id="range-popover" role="dialog" aria-label="选择日期范围" hidden>
                  <div class="calendar-input-row">
                    <label class="calendar-input-card">
                      <span>开始日期</span>
                      <input id="home-date-start" type="date" aria-label="开始日期">
                    </label>
                    <label class="calendar-input-card">
                      <span>结束日期</span>
                      <input id="home-date-end" type="date" aria-label="结束日期">
                    </label>
                  </div>
                  <div id="home-calendar-grid" class="range-calendar-grid" aria-live="polite"></div>
                  <div class="calendar-pick-note">先选开始日期，再选结束日期；也可以直接输入日期。快捷时间不用打开弹窗。</div>
                </div>
              </div>
            </div>

            <div class="quick command-actions">
              <button id="force-refresh" class="refresh-cache-button" type="button" title="丢弃本进程缓存，重新读取云端已物化数据；不会重抓 SHEIN">强制刷新缓存</button>
              <button id="clear-filters" class="clear-button" type="button">清空</button>
            </div>
          </div>
        </header>

        <section id="error-panel" class="global-error" hidden role="alert" aria-live="assertive">
          <div>
            <strong>基础数据刷新失败</strong>
            <p id="error-message">云端只读数据服务暂不可用。</p>
          </div>
          <button id="retry-button" type="button">重新加载</button>
        </section>

        <main id="content" tabindex="-1">
          <div id="view" aria-busy="true" aria-live="polite">
            <section class="loading-shell" role="status">
              <span class="loading-line wide"></span>
              <span class="loading-line"></span>
              <div class="loading-grid">
                <span></span><span></span><span></span><span></span>
              </div>
              <p>正在读取全托销量与接入状态…</p>
            </section>
          </div>
        </main>

        <footer class="footer">
          <span>全托 BI · 经营数据与运营筛查</span>
          <span>缺失值不补零；建议不等于已执行，采购、交付与库存按独立事实口径展示。</span>
        </footer>
      </div>
    </div>

    <div id="chart-tooltip" class="chart-tooltip" role="presentation" hidden></div>
  </body>
</html>
