# Shared advisory lock for full-managed browser, OpenAPI and materialization
# jobs. It contains no data; mode 0666 lets isolated service identities hold the
# same kernel lock without granting access to another component's runtime files.
f /run/lock/shein-fm-heavy.lock 0666 root root -
# Neutral outer lock shared by semi-managed and full-managed host-heavy jobs.
# Project-specific locks remain nested inside this host-level lock.
f /run/lock/shein-host-heavy.lock 0666 root root -
# Two read-only browser slots. Full-managed prefers slot 0, semi-managed slot
# 1; either project may borrow the other slot while it is idle. The second
# active browser is admitted only by the stricter 4GiB pressure profile.
f /run/lock/shein-browser-read-0.lock 0666 root root -
f /run/lock/shein-browser-read-1.lock 0666 root root -
# OpenAPI/light-DB work uses two independent tokens and never waits behind a
# long browser or backup merely because both are called "batch" jobs.
f /run/lock/shein-api-light-0.lock 0666 root root -
f /run/lock/shein-api-light-1.lock 0666 root root -
# Shared service runtime directories must outlive any one oneshot. Several
# independent units reuse each directory, and ReadWritePaths resolves it before
# ExecStart. Creating it at boot and preserving it between units prevents a
# completed job from making the next job fail with 226/NAMESPACE.
d /run/shein-fm-webapi 0700 sheinfm sheinfm -
d /run/shein-fm-sales 0700 sheinfm-sales sheinfm-sales -
d /run/shein-fm-supply 0700 sheinfm-supply sheinfm-supply -
# Persistent, non-secret scheduler terminal markers. Each component can only
# write its own subdirectory; downstream jobs read dates/status instead of
# assuming that a predecessor succeeded merely because a clock time passed.
# Parent contains no component data and only grants traversal. Each owned child
# remains 0700, so service users can reach only their own marker directory.
d /srv/shein-fm/runtime/scheduler 0755 root root -
d /srv/shein-fm/runtime/scheduler/home 0700 sheinfm sheinfm -
d /srv/shein-fm/runtime/scheduler/sales 0700 sheinfm-sales sheinfm-sales -
d /srv/shein-fm/runtime/scheduler/finance 0700 sheinfm-sales sheinfm-sales -
d /srv/shein-fm/runtime/scheduler/supply 0700 sheinfm-supply sheinfm-supply -
d /srv/shein-fm/runtime/backup-restore-test 0700 root root -
