# Shared advisory lock for full-managed browser, OpenAPI and materialization
# jobs. It contains no data; mode 0666 lets isolated service identities hold the
# same kernel lock without granting access to another component's runtime files.
f /run/lock/shein-fm-heavy.lock 0666 root root -
# Neutral outer lock shared by semi-managed and full-managed host-heavy jobs.
# Project-specific locks remain nested inside this host-level lock.
f /run/lock/shein-host-heavy.lock 0666 root root -
# Shared service runtime directories must outlive any one oneshot. Several
# independent units reuse each directory, and ReadWritePaths resolves it before
# ExecStart. Creating it at boot and preserving it between units prevents a
# completed job from making the next job fail with 226/NAMESPACE.
d /run/shein-fm-webapi 0700 sheinfm sheinfm -
d /run/shein-fm-sales 0700 sheinfm-sales sheinfm-sales -
d /run/shein-fm-supply 0700 sheinfm-supply sheinfm-supply -
