name: shein-fm

services:
  db:
    image: postgres:16-alpine
    container_name: shein-fm-db
    restart: unless-stopped
    env_file:
      - /srv/shein-fm/secrets/postgres.env
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - shein-fm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  shein-fm-postgres:
    external: true
    name: shein-fm-postgres
