# Standalone nginx.conf, not an include for the public gateway.
# Install at /etc/shein-fm/lan-nginx.conf. No public listener or static data mounts.
# Office HTTP is explicitly approved; credentials are not encrypted in transit.
user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
# nginx error messages may contain request URLs/tokens; do not persist them.
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 3600s;

    # Deliberately omit even URI paths (short-lived tokens can be path segments).
    log_format lan_safe '$remote_addr $time_iso8601 $request_method '
                        '$status $body_bytes_sent $request_time $upstream_status';
    access_log /dev/stdout lan_safe;

    map $http_upgrade $lan_connection {
        default upgrade;
        '' close;
    }
    # Check the actual Host header, not $host's server_name fallback.
    map $http_host $lan_host_valid {
        default 0;
        ~^192[.]168[.]1[.]79(:80)?$ 1;
    }

    server {
        listen 192.168.1.79:80 default_server;
        server_name _;
        access_log off;
        allow 192.168.1.0/24;
        deny all;
        return 444;
    }

    server {
        listen 192.168.1.79:80;
        server_name 192.168.1.79;

        allow 192.168.1.0/24;
        deny all;
        if ($lan_host_valid = 0) { return 444; }

        # Main owner approved LAN compatibility against the existing StoreLogin:
        # batch bearer and websocket session tokens remain service-validated.
        # Reuse the same instance/queue; never synthesize Origin or internal auth.
        location ~* ^/(store-login|api/store-login)(/|$) {
            access_log off;
            proxy_pass http://127.0.0.1:8794;
        }

        # These public ingress/authorization endpoints never belong on this LAN
        # gateway. Prefix families also cover callbacks and trailing slashes.
        location ~* ^/(api/shein/webhook|webhook|openapi/authorize|authorize)(/|$) {
            access_log off;
            return 403;
        }

        # Shared by all proxy locations; none overrides these headers.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header Forwarded "";
        proxy_set_header X-FM-Internal-Token "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lan_connection;
        # Origin, Authorization and Cookie pass unchanged. Portal owns auth,
        # CSRF/Origin checks and Set-Cookie flags; no rewrites or auth bypass.
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_redirect off;

        # Portal maintenance API is distinct from the standalone bearer UI above.
        # Preserve Portal's existing token/permission/Origin checks unmodified.
        location ~* ^/api/system/store-login(/|$) {
            access_log off;
            proxy_pass http://127.0.0.1:8787;
        }

        location / {
            # Independent authenticated LAN Portal; not the existing 8788 portal.
            # Until it is started and accepted, requests may return 502.
            proxy_pass http://127.0.0.1:8787;
        }
    }
}
