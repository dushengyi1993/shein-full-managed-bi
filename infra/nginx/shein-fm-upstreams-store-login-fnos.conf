# Install as /etc/nginx/shein-fm-upstreams.conf only for the store-login
# staging window.  Portal and Webhook stay cloud-local; only StoreLogin
# returns through the fnOS reverse loopback listener.
upstream shein_fm_portal {
    server 127.0.0.1:8788;
}

upstream shein_fm_webhook {
    server 127.0.0.1:8793;
}

upstream shein_fm_store_login {
    server 127.0.0.1:18794;
}
