# Install as /etc/nginx/shein-fm-upstreams.conf for the current cloud layout.
# These services remain cloud-local during the fnOS cutover baseline.
upstream shein_fm_portal {
    server 127.0.0.1:8788;
}

upstream shein_fm_webhook {
    server 127.0.0.1:8793;
}

upstream shein_fm_store_login {
    server 127.0.0.1:8794;
}
