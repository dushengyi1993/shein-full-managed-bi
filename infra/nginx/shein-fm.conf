limit_req_zone $binary_remote_addr zone=shein_fm_auth_callback:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shein_fm_auth_web:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shein_fm_webhook_ingress:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=shein_fm_webhook_connections:1m;

# The upstream selection is environment-owned.  Install either
# infra/nginx/shein-fm-upstreams-cloud.conf or
# infra/nginx/shein-fm-upstreams-fnos.conf at this stable path.  The
# Authorization service is intentionally not included in this switch.
include /etc/nginx/shein-fm-upstreams.conf;
log_format shein_fm_auth_safe
    '$remote_addr - $time_iso8601 "$request_method $uri" $status $request_time';
log_format shein_fm_webhook_safe
    '$remote_addr - $time_iso8601 "$request_method $uri" $status '
    '$request_time $request_length';

server {
    listen 127.0.0.1:8081;
    server_name fm.dushengyi.cc;

    # Keep HSTS scoped to this hostname. Descendants of fm.dushengyi.cc are
    # outside this service boundary, so do not add includeSubDomains or preload.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/shein-fm-access.log;
    error_log /var/log/nginx/shein-fm-error.log;

    # Homepage history is date-scoped but can still contain several thousand
    # daily fact rows. Compress authenticated JSON and static assets in transit;
    # response caching remains controlled by the application.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css image/svg+xml;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    client_max_body_size 16k;

    # Authorization links keep their bearer value in the URL fragment, so it
    # never reaches any proxy. The SHEIN callback necessarily carries a
    # short-lived tempToken in its query string. The dedicated authorization
    # log format records only $uri and never $args or $request.
    location = /openapi/authorize/callback {
        access_log /var/log/nginx/shein-fm-auth-security.log shein_fm_auth_safe;
        error_log /dev/null crit;
        limit_req zone=shein_fm_auth_callback burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /authorize {
        access_log /var/log/nginx/shein-fm-auth-security.log shein_fm_auth_safe;
        error_log /dev/null crit;
        limit_req zone=shein_fm_auth_web burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ^~ /authorize/ {
        access_log /var/log/nginx/shein-fm-auth-security.log shein_fm_auth_safe;
        error_log /dev/null crit;
        limit_req zone=shein_fm_auth_web burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
    }

    # The receiver verifies the original SHEIN signature before persisting an
    # encrypted receipt. Keep this exact route separate from the authenticated
    # BI portal, and do not forward unrelated browser credentials or headers.
    location = /api/shein/webhook/v1/events {
        access_log /var/log/nginx/shein-fm-webhook-access.log shein_fm_webhook_safe;
        error_log /var/log/nginx/shein-fm-webhook-error.log crit;
        client_max_body_size 1m;
        client_body_timeout 5s;
        limit_req zone=shein_fm_webhook_ingress burst=80 nodelay;
        limit_req_status 429;
        limit_conn shein_fm_webhook_connections 20;

        proxy_pass http://shein_fm_webhook;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $content_length;
        proxy_set_header X-Lt-Appid $http_x_lt_appid;
        proxy_set_header X-Lt-Openkeyid $http_x_lt_openkeyid;
        proxy_set_header X-Lt-Eventcode $http_x_lt_eventcode;
        proxy_set_header X-Lt-Timestamp $http_x_lt_timestamp;
        proxy_set_header X-Lt-Signature $http_x_lt_signature;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }

    # External 25-store cloud login page. The batch bearer stays in the URL
    # fragment and then in an Authorization header, so it never enters logs.
    # Short-lived noVNC websocket tokens necessarily appear in the internal
    # path; disable access logging for the entire isolated route family.
    location = /store-login {
        access_log off;
        charset utf-8;
        proxy_pass http://shein_fm_store_login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    location ^~ /store-login/ {
        access_log off;
        charset utf-8;
        proxy_pass http://shein_fm_store_login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/store-login/ {
        access_log off;
        charset utf-8;
        client_max_body_size 8k;
        proxy_pass http://shein_fm_store_login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-FM-Internal-Token "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://shein_fm_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
