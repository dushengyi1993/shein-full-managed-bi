limit_req_zone $binary_remote_addr zone=shein_fm_auth_callback:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shein_fm_auth_web:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shein_fm_webhook_ingress:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=shein_fm_webhook_connections:1m;
log_format shein_fm_auth_safe
    '$remote_addr - $time_iso8601 "$request_method $uri" $status $request_time';
log_format shein_fm_webhook_safe
    '$remote_addr - $time_iso8601 "$request_method $uri" $status '
    '$request_time $request_length';

server {
    listen 127.0.0.1:8081;
    server_name fm.dushengyi.cc;

    access_log /var/log/nginx/shein-fm-access.log;
    error_log /var/log/nginx/shein-fm-error.log;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    client_max_body_size 16k;

    # Authorization links keep their bearer value in the URL fragment, so it
    # never reaches any proxy. The SHEIN callback necessarily carries a
    # short-lived tempToken in its query string. The dedicated authorization
    # log format records only $uri and never $args or $request.
    location = /openapi/authorize/callback {
        access_log /var/log/nginx/shein-fm-auth-security.log shein_fm_auth_safe;
        error_log /dev/null crit;
        limit_req zone=shein_fm_auth_callback burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /authorize {
        access_log /var/log/nginx/shein-fm-auth-security.log shein_fm_auth_safe;
        error_log /dev/null crit;
        limit_req zone=shein_fm_auth_web burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ^~ /authorize/ {
        access_log /var/log/nginx/shein-fm-auth-security.log shein_fm_auth_safe;
        error_log /dev/null crit;
        limit_req zone=shein_fm_auth_web burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
    }

    # The receiver verifies the original SHEIN signature before persisting an
    # encrypted receipt. Keep this exact route separate from the authenticated
    # BI portal, and do not forward unrelated browser credentials or headers.
    location = /api/shein/webhook/v1/events {
        access_log /var/log/nginx/shein-fm-webhook-access.log shein_fm_webhook_safe;
        error_log /var/log/nginx/shein-fm-webhook-error.log crit;
        client_max_body_size 1m;
        client_body_timeout 5s;
        limit_req zone=shein_fm_webhook_ingress burst=80 nodelay;
        limit_req_status 429;
        limit_conn shein_fm_webhook_connections 20;

        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $content_length;
        proxy_set_header X-Lt-Appid $http_x_lt_appid;
        proxy_set_header X-Lt-Openkeyid $http_x_lt_openkeyid;
        proxy_set_header X-Lt-Eventcode $http_x_lt_eventcode;
        proxy_set_header X-Lt-Timestamp $http_x_lt_timestamp;
        proxy_set_header X-Lt-Signature $http_x_lt_signature;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
