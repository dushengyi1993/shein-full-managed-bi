# Install as /etc/nginx/shein-fm-upstreams.conf after the restricted reverse
# SSH listeners have passed loopback and end-to-end probes.  These addresses
# are cloud-sshd listeners that return to the fnOS loopback services.
upstream shein_fm_portal {
    server 127.0.0.1:18788;
}

upstream shein_fm_webhook {
    server 127.0.0.1:18793;
}

upstream shein_fm_store_login {
    server 127.0.0.1:18794;
}
